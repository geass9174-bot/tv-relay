name: bars-daily

on:
  workflow_dispatch:
  schedule:
    # TV daily bars open at 18:00 ET, which is 23:00Z in EST and 22:00Z in EDT.
    # 23:05Z is 5 minutes after the winter close and 1h05m after the summer
    # open, so it is after the close in both seasons. The old 22:30Z was 30
    # minutes BEFORE the winter close, which stored the bar short of its own
    # session - and in summer the same hour happened to fall after the close,
    # so the defect was seasonal and no test ever went red on it.
    - cron: '5 23 * * *'

permissions:
  contents: write

concurrency:
  group: tv-relay-commit
  cancel-in-progress: false

jobs:
  bars:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Fetch daily bars
        run: node scripts/bars.mjs D
      - name: Commit
        run: |
          git config user.name "tv-relay-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/bars data/index.json
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "bars-d: $(date -u +%FT%TZ) [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          echo "push failed after 5 attempts"
          exit 1
