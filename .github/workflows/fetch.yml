name: quotes

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

# Shared with bars.yml / bars-daily.yml so the three never race on push.
concurrency:
  group: tv-relay-commit
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Fetch quotes
        run: node scripts/fetch.mjs
      - name: Commit
        run: |
          git config user.name "tv-relay-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/quotes.json
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "quotes: $(date -u +%FT%TZ) [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          echo "push failed after 5 attempts"
          exit 1
