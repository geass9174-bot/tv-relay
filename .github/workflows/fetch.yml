name: quotes

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

# Shared with bars.yml / bars-daily.yml so the three never race on push.
concurrency:
  group: tv-relay-commit
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Fetch quotes
        run: node scripts/fetch.mjs
      # H1 refresh rides on this job because its own cron never fired.
      # bars.yml is registered and active but the scheduler skipped its 16:05
      # slot, so we no longer depend on a second cron being honoured. Gated to
      # the first half hour: two attempts per hour, and bars.mjs re-reads 200
      # bars each time so a missed hour backfills on the next successful run.
      - name: Fetch H1 bars (top of hour)
        run: |
          M=$(date -u +%M)
          if [ "$M" -lt 30 ]; then
            echo "minute $M - fetching H1"
            node scripts/bars.mjs 60
          else
            echo "minute $M - outside the hour window, skip H1"
          fi
      - name: Build brief
        run: node scripts/brief.mjs
      - name: Commit
        run: |
          git config user.name "tv-relay-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/quotes.json data/brief.json data/bars data/index.json
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "quotes: $(date -u +%FT%TZ) [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          echo "push failed after 5 attempts"
          exit 1
