name: quotes

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

# Shared with bars.yml / bars-daily.yml so the three never race on push.
concurrency:
  group: tv-relay-commit
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Fetch quotes
        run: node scripts/fetch.mjs
      # bars.yml and bars-daily.yml are registered and active, but GitHub's
      # scheduler never dispatched them (zero bars commits in 20). So both bar
      # fetches now ride on this job, which demonstrably fires every 15 min.
      # bars.mjs re-reads 200 bars per call, so a missed window backfills on the
      # next successful run - no data loss, just a later write.
      - name: Fetch H1 bars (first half of the hour)
        run: |
          M=$(date -u +%M)
          if [ "$M" -lt 30 ]; then
            echo "minute $M - fetching H1"
            node scripts/bars.mjs 60
          else
            echo "minute $M - outside the hour window, skip H1"
          fi
      # 23:05-23:30 UTC is after the session close in BOTH seasons. TV daily bars
      # open at 18:00 ET, which is 23:00Z in EST and 22:00Z in EDT. The previous
      # window (22:30-23:00Z) was 30 minutes BEFORE the winter close, so the bar
      # was stored 30 minutes short of its own session; in summer it happened to
      # fall after the close, which is why the defect was seasonal and no test
      # went red. Do not move this back to an earlier hour. bars.mjs writes the
      # whole array, so the run that sees a new bar also stores the previous one
      # final - one run after the close is enough.
      - name: Fetch daily bars (23:05-23:30 UTC window)
        run: |
          HM=$(date -u +%H%M)
          if [ "$HM" -ge 2305 ] && [ "$HM" -lt 2330 ]; then
            echo "$HM UTC - fetching daily"
            node scripts/bars.mjs D
          else
            echo "$HM UTC - outside the daily window, skip D"
          fi
      - name: Build brief
        run: node scripts/brief.mjs
      - name: Commit
        run: |
          git config user.name "tv-relay-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/quotes.json data/brief.json data/bars data/index.json
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "quotes: $(date -u +%FT%TZ) [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          echo "push failed after 5 attempts"
          exit 1
